# ===========================================
# Spring Boot 应用配置 — 核心配置
# 按关注点拆分的配置通过 spring.config.import 加载
# - config/datasource.yaml: 数据源 + Flyway
# - config/cache.yaml:      Redis + Redisson
# - config/mq.yaml:         RocketMQ
# - config/security.yaml:   安全 + JWT
# - config/business.yaml:   MyBatis Plus + 秒杀 + 日志
# ===========================================
spring:
  application:
    name: admin-system                    # 应用名称

  config:
    import:
      - classpath:config/datasource.yaml
      - classpath:config/cache.yaml
      - classpath:config/mq.yaml
      - classpath:config/security.yaml
      - classpath:config/business.yaml

  # ===========================================
  # 虚拟线程配置（Java 21+）
  # 虚拟线程可以大幅减少线程内存开销，支持海量并发连接
  # ===========================================
  threads:
    virtual:
      enabled: true                       # 启用虚拟线程

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 20MB                 # 单个文件最大大小
      max-request-size: 20MB              # 请求最大大小

# ===========================================
# 服务器配置
# ===========================================
server:
  port: 8080                              # 服务端口号
