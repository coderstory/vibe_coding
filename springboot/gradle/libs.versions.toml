[versions]
spring-boot = "4.1.0-RC1"
spring-dm = "1.1.7"                # dependency-management plugin
spring-boot-starter-aop = "4.0.0-M2"
flyway = "12.5.0"
mysql = "9.7.0"
mybatis-plus = "3.5.16"
rocketmq = "5.5.0"
rocketmq-spring = "2.3.5"
redisson = "4.3.1"
jjwt = "0.13.0"
zstd = "1.5.7-7"
lombok = "1.18.44"
archunit = "1.4.2"
checkstyle = "10.21.4"

[libraries]
# BOM
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Spring Boot Starters (BOM managed — no version)
spring-boot-web = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-config-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# Spring Boot (custom version)
spring-boot-aop = { module = "org.springframework.boot:spring-boot-starter-aop", version.ref = "spring-boot-starter-aop" }

# Spring
spring-messaging = { module = "org.springframework:spring-messaging" }

# Database
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
mybatis-plus = { module = "com.baomidou:mybatis-plus-spring-boot4-starter", version.ref = "mybatis-plus" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }

# Messaging
rocketmq-client = { module = "org.apache.rocketmq:rocketmq-client", version.ref = "rocketmq" }
rocketmq-spring = { module = "org.apache.rocketmq:rocketmq-spring-boot-starter", version.ref = "rocketmq-spring" }
rocketmq-tools = { module = "org.apache.rocketmq:rocketmq-tools", version.ref = "rocketmq" }

# Cache & Lock
redisson = { module = "org.redisson:redisson-spring-boot-starter", version.ref = "redisson" }

# JWT
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# Utils
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd" }

# Annotation Processors
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Test
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dm = { id = "io.spring.dependency-management", version.ref = "spring-dm" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
