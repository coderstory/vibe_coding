# Gradle JVM args - 启用 preview features
# 注意: file.encoding=GBK 是必需的，否则中文路径在 JVM @argfile 中解析失败
org.gradle.jvmargs=-Dfile.encoding=GBK --enable-preview

# Enable parallel build
org.gradle.parallel=true

# Enable build cache
org.gradle.caching=true

# Java installations auto detect
org.gradle.java.installations.auto-detect=true
